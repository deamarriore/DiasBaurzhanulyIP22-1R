{% extends "accounting/base.html" %}
{% block title %}Журнал проводок{% endblock %}
{% block content %}
<h1 class="mb-3">Журнал проводок</h1>
<div class="table-responsive card shadow-sm">
    <table class="table table-hover mb-0">
        <thead><tr><th>Номер</th><th>Дата</th><th>Описание</th><th>Автор</th></tr></thead>
        <tbody>
        {% for e in entries %}
            <tr>
                <td><a href="{% url 'accounting:journal_detail' e.pk %}">{{ e.number }}</a></td>
                <td>{{ e.date }}</td>
                <td>{{ e.description }}</td>
                <td>{{ e.created_by }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="4" class="text-muted">Нет проводок</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
