{% extends "accounting/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3">
    <div>
        <h1 class="mb-1">{{ title }}</h1>
        <p class="text-muted mb-0">Создай операцию, затем проведи её.</p>
    </div>
    <div class="no-print">
        <a href="{% url 'accounting:cash_list' %}" class="btn btn-outline-primary">К списку</a>
    </div>
</div>
<form method="post" novalidate>
    {% csrf_token %}
    <div class="card mb-3">
        <div class="card-body row g-3">
            {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit" name="save_draft" class="btn btn-outline-primary">Сохранить черновик</button>
    <button type="submit" name="save_post" class="btn btn-primary">Сохранить и провести</button>
    <a href="{% url 'accounting:cash_list' %}" class="btn btn-link">Отмена</a>
</form>
{% endblock %}
